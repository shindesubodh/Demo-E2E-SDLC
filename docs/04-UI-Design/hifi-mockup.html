<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team To-Do Tracker – Hi-Fi mockup</title><style>:root{--c-bg:#f6f7f9;--c-surface:#ffffff;--c-text:#1c2430;--c-muted:#55606e;--c-border:#d5dae1;--c-primary:#1d5fd1;--c-primary-hover:#174ea9;--c-on-primary:#ffffff;--c-week-bg:#fff4d6;--c-week-text:#7a4d00;--c-done:#1e7a46;--c-danger:#b42318;--c-danger-bg:#fdecea;--c-focus:#ffbf47;--c-mock:#2b2f36;--font:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--fs-xs:.8125rem;--fs-sm:.875rem;--fs-md:1rem;--fs-lg:1.25rem;--fs-xl:1.5rem;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--radius:8px;--radius-sm:4px;--shadow:0 1px 3px rgba(0,0,0,.12)}*{box-sizing:border-box}body{margin:0;font-family:var(--font);font-size:var(--fs-md);color:var(--c-text);background:var(--c-bg);line-height:1.45}.mock{background:var(--c-mock);color:#fff;padding:var(--sp-2) var(--sp-3);display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center;font-size:var(--fs-xs)}.mock b{margin-right:var(--sp-2)}.mock button{background:#444a54;color:#fff;border:1px solid #6b7280;border-radius:var(--radius-sm);padding:4px 8px;font:inherit;cursor:pointer}.mock button[aria-pressed=true]{background:#fff;color:var(--c-mock)}.mock .vp{margin-left:auto;display:flex;gap:var(--sp-1);align-items:center}:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px}#frame{margin:0 auto;background:var(--c-bg);min-height:100vh}#frame.w375{width:375px;box-shadow:0 0 0 1px #8a94a3}#frame.w1280{width:1280px;max-width:100%;box-shadow:0 0 0 1px #8a94a3}.hdr{background:var(--c-surface);border-bottom:1px solid var(--c-border);padding:var(--sp-3) var(--sp-4);display:flex;flex-wrap:wrap;gap:var(--sp-3);justify-content:space-between;align-items:center}.hdr h1{font-size:var(--fs-lg);margin:0}.nav{display:flex;gap:var(--sp-2)}.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:var(--sp-2);font:inherit;color:var(--c-muted);cursor:pointer;min-height:44px}.nav button[aria-current=page]{color:var(--c-primary);border-color:var(--c-primary);font-weight:600}main{max-width:880px;margin:0 auto;padding:var(--sp-4)}.card{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--radius);padding:var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadow)}h2{font-size:var(--fs-lg);margin:0 0 var(--sp-3)}h3{font-size:var(--fs-md);margin:var(--sp-4) 0 var(--sp-2)}.grid{display:grid;gap:var(--sp-3);grid-template-columns:minmax(0,1fr)}.w1280 .grid.form,.wide .grid.form{grid-template-columns:2fr 1fr 1fr auto;align-items:end}.w1280 .grid.filters,.wide .grid.filters{grid-template-columns:1fr 1fr auto;align-items:end}@media(min-width:720px){#frame:not(.w375) .grid.form{grid-template-columns:2fr 1fr 1fr auto;align-items:end}#frame:not(.w375) .grid.filters{grid-template-columns:1fr 1fr auto;align-items:end}}label{display:block;font-size:var(--fs-sm);font-weight:600;margin-bottom:var(--sp-1)}input,select{width:100%;max-width:100%;font:inherit;padding:10px var(--sp-3);border:1px solid #8a94a3;border-radius:var(--radius-sm);background:#fff;color:var(--c-text);min-height:44px}input[type=date]{-webkit-appearance:none;appearance:none;min-width:0;display:block}input[type=file]{padding:8px;font-size:var(--fs-sm)}input[aria-invalid=true]{border-color:var(--c-danger);border-width:2px}.err{color:var(--c-danger);font-size:var(--fs-sm);margin-top:var(--sp-1)}.hint{color:var(--c-muted);font-size:var(--fs-xs)}.btn{font:inherit;font-weight:600;min-height:44px;padding:10px var(--sp-4);border-radius:var(--radius-sm);border:1px solid var(--c-primary);background:var(--c-primary);color:var(--c-on-primary);cursor:pointer}.btn:hover{background:var(--c-primary-hover)}.btn.sec{background:#fff;color:var(--c-primary)}.btn.danger{background:var(--c-danger);border-color:var(--c-danger);color:#fff}.btn.link{background:none;border:0;color:var(--c-primary);padding:6px 8px;min-height:44px}.btn.link.del{color:var(--c-danger)}.btn:disabled{background:#e4e7eb;border-color:#c3c9d1;color:#5f6874;cursor:not-allowed}ul.list{list-style:none;margin:0;padding:0}.item{display:flex;gap:var(--sp-3);align-items:flex-start;padding:var(--sp-3);border:1px solid var(--c-border);border-radius:var(--radius);margin-bottom:var(--sp-2);background:#fff}.item.week{background:var(--c-week-bg);border-color:#e8c46a}.item.done .t{text-decoration:line-through;color:var(--c-muted)}.item input[type=checkbox]{width:22px;height:22px;min-height:0;margin-top:2px;accent-color:var(--c-done);flex:none}.body{flex:1;min-width:0}.t{font-weight:600;overflow-wrap:anywhere}.meta{display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);font-size:var(--fs-sm);color:var(--c-muted);margin-top:2px}.badge{display:inline-block;font-size:var(--fs-xs);font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid currentColor}.b-week{color:var(--c-week-text);background:#fff}.b-done{color:var(--c-done)}.b-pend{color:var(--c-primary)}.b-un{color:var(--c-muted)}.acts{display:flex;flex-wrap:wrap}.w375 .item{flex-wrap:wrap}.w375 .acts{width:100%;justify-content:flex-end}.bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-3)}.count{color:var(--c-muted);font-size:var(--fs-sm)}.empty{text-align:center;padding:var(--sp-6) var(--sp-4);color:var(--c-muted)}.warn{background:var(--c-danger-bg);color:var(--c-danger);border:1px solid #f1b5ae;padding:var(--sp-3) var(--sp-4);font-size:var(--fs-sm)}.overlay{position:fixed;inset:0;background:rgba(16,22,30,.55);display:flex;align-items:center;justify-content:center;padding:var(--sp-4)}.dialog{background:#fff;border-radius:var(--radius);padding:var(--sp-5);max-width:420px;width:100%}.dialog .row{display:flex;flex-wrap:wrap;gap:var(--sp-2);justify-content:flex-end;margin-top:var(--sp-4)}.mrow{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:end;padding:var(--sp-2) 0;border-bottom:1px solid var(--c-border)}.mrow .grow{flex:1 1 160px;min-width:0}.sw{display:flex;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-2);font-size:var(--fs-sm)}.sw i{width:40px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--c-border);flex:none}.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:var(--fs-sm)}td,th{border-bottom:1px solid var(--c-border);padding:6px;text-align:left;vertical-align:top}code{font-size:var(--fs-xs);background:#eef1f5;padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}[hidden]{display:none!important}</style></head><body><div class="mock" role="toolbar" aria-label="Mockup screens"><b>MOCKUP</b><button data-s="filled">Tasks – default</button><button data-s="empty">Tasks – empty</button><button data-s="error">Add – title error</button><button data-s="all">Filter: Priya + All</button><button data-s="done">Filter: Done + Clear confirm</button><button data-s="edit">Edit task</button><button data-s="del">Delete confirm</button><button data-s="warn">Storage warning</button><button data-s="settings">Settings</button><button data-s="limit">Settings – 10 members</button><button data-s="import">Import – replace warning</button><button data-s="importerr">Import error</button><button data-s="notes">Design notes</button><span class="vp" role="group" aria-label="Viewport width"><button data-w="fluid">Fluid</button><button data-w="w375">375px phone</button><button data-w="w1280">1280px laptop</button></span></div><div id="frame"><div id="app"></div></div><script>var M=[['m1','Priya'],['m2','Tom'],['m3','Aisha'],['m4','Jonas'],['m5','Mei']];var T=[{t:'Book team room for Thursday review',a:'m1',d:'Tue 17 Nov 2026',w:1},{t:'Send sprint summary to stakeholders',a:'m2',d:'Fri 20 Nov 2026',w:1},{t:'Update onboarding checklist',a:null,d:'Sun 22 Nov 2026',w:1},{t:'Renew software licences',a:'m3',d:'Wed 2 Dec 2026',w:0},{t:'Collect feedback on new rota',a:'x',d:'',w:0}];var D=[{t:'Order printer toner',a:'m4',d:'Mon 16 Nov 2026'},{t:'Fix shared drive permissions',a:'m2',d:'Fri 13 Nov 2026'},{t:'Plan December social',a:'m5',d:''}];var PA=[{t:'Book team room for Thursday review',a:'m1',d:'Tue 17 Nov 2026',w:1},{t:'Draft Q1 hiring plan',a:'m1',d:'Fri 4 Dec 2026',w:0},{t:'Order new whiteboard markers',a:'m1',d:'Thu 12 Nov 2026',w:0,x:1}];var W='fluid',CUR='filled';function nm(a){for(var i=0;i<M.length;i++)if(M[i][0]==a)return M[i][1];return null}function opts(sel){var h='<option value="">Unassigned</option>';M.forEach(function(m){h+='<option'+(m[0]==sel?' selected':'')+'>'+m[1]+'</option>'});return h}function hdr(p){return '<header class="hdr"><h1>Team To-Do Tracker</h1><nav class="nav" aria-label="Main"><button '+(p=='t'?'aria-current="page"':'')+' data-s="filled">Tasks</button><button '+(p=='s'?'aria-current="page"':'')+' data-s="settings">Settings</button></nav></header>'}function form(err,edit){var e=edit||{};return '<section class="card" aria-labelledby="fh"><h2 id="fh">'+(edit?'Edit task':'Add a task')+'</h2><form class="grid form" onsubmit="return false"><div><label for="ti">Title (required)</label><input id="ti" maxlength="120" value="'+(e.t||'')+'" '+(err?'aria-invalid="true" aria-describedby="te"':'aria-describedby="tc"')+'>'+(err?'<div class="err" id="te" role="alert">Enter a title (1–120 characters).</div>':'<div class="hint" id="tc">'+(e.t?e.t.length:0)+'/120</div>')+'</div><div><label for="as">Assignee</label><select id="as">'+opts(e.a)+'</select></div><div><label for="du">Due date</label><input id="du" type="date" value="'+(e.iso||'')+'"></div><div>'+(edit?'<button class="btn">Save</button> <button class="btn sec" type="button">Cancel</button>':'<button class="btn">Add task</button>')+'</div></form>'+(edit?'<p class="hint">Created 10 Nov 2026 (does not change).</p>':'')+'</section>'}function filters(st,dn,as){return '<section class="card" aria-label="Filters"><div class="grid filters"><div><label for="fa">Assignee</label><select id="fa"><option>All</option><option>Unassigned</option>'+M.map(function(m){return '<option'+(m[1]==as?' selected':'')+'>'+m[1]+'</option>'}).join('')+'</select></div><div><label for="fs">Status</label><select id="fs"><option'+(st=='Pending'?' selected':'')+'>Pending</option><option'+(st=='Done'?' selected':'')+'>Done</option><option'+(st=='All'?' selected':'')+'>All</option></select></div><div><button class="btn sec" '+(dn?'':'disabled')+'>Clear completed</button></div></div></section>'}function item(x,done,showP){var n=nm(x.a);return '<li class="item'+(x.w&&!done?' week':'')+(done?' done':'')+'"><input type="checkbox" aria-label="Mark '+x.t+' as '+(done?'pending':'done')+'"'+(done?' checked':'')+'><div class="body"><div class="t">'+x.t+'</div><div class="meta"><span>'+(n?'👤 '+n:'<span class="badge b-un">Unassigned</span>')+'</span><span>'+(x.d?'Due '+x.d:'No due date')+'</span>'+(x.w&&!done?'<span class="badge b-week">This week</span>':'')+(done?'<span class="badge b-done">✓ Done</span>':(showP?'<span class="badge b-pend">Pending</span>':''))+'</div></div><div class="acts"><button class="btn link" data-s="edit" aria-label="Edit '+x.t+'">Edit</button><button class="btn link del" data-s="del" aria-label="Delete '+x.t+'">Delete</button></div></li>'}function list(arr,done,label){return '<section class="card" aria-labelledby="lh"><div class="bar"><h2 id="lh" style="margin:0">'+label+'</h2><span class="count" aria-live="polite">'+arr.length+' tasks</span></div><ul class="list">'+arr.map(function(x){return item(x,done)}).join('')+'</ul></section>'}function mixed(arr,label){return '<section class="card" aria-labelledby="lh"><div class="bar"><h2 id="lh" style="margin:0">'+label+'</h2><span class="count" aria-live="polite">'+arr.length+' tasks</span></div><ul class="list">'+arr.map(function(x){return item(x,x.x,1)}).join('')+'</ul></section>'}function dlg(title,body,ok,back){return '<div class="overlay"><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dh" aria-describedby="db"><h2 id="dh">'+title+'</h2><p id="db">'+body+'</p><div class="row"><button class="btn sec" data-s="'+back+'">Cancel</button><button class="btn danger" data-s="'+back+'">'+ok+'</button></div></div></div>'}function settings(full,ierr,ifile){var ms=full?M.concat([['m6','Lukas'],['m7','Sara'],['m8','Omar'],['m9','Elena'],['m10','Ravi']]):M;return hdr('s')+'<main><section class="card" aria-labelledby="mh"><h2 id="mh">Team members ('+ms.length+'/10)</h2><form class="mrow" onsubmit="return false"><div class="grow"><label for="nm">New member name</label><input id="nm" maxlength="40" '+(full?'aria-describedby="me" value="Hannah"':'')+'></div><button class="btn">Add</button></form>'+(full?'<div class="err" id="me" role="alert">Maximum 10 team members</div>':'')+'<ul class="list" style="margin-top:var(--sp-3)">'+ms.map(function(m){return '<li class="mrow"><div class="grow"><label for="r'+m[0]+'">Name</label><input id="r'+m[0]+'" value="'+m[1]+'" maxlength="40"></div><button class="btn sec">Rename</button><button class="btn link del" aria-label="Remove '+m[1]+'">Remove</button></li>'}).join('')+'</ul><p class="hint">Removing a member shows their tasks as Unassigned.</p></section><section class="card" aria-labelledby="xh"><h2 id="xh">Export and import</h2><p class="hint">Export saves all tasks and members as a JSON file. Import replaces the current list after a warning.</p><div class="grid"><div><button class="btn">Export to file</button></div><div><label for="im">Import from file</label><input id="im" type="file" accept=".json,application/json" '+(ierr?'aria-describedby="ie"':'')+'>'+(ifile?'<div class="hint">Selected: team-todo-2026-11-18.json</div>':'')+(ierr?'<div class="err" id="ie" role="alert">This file is not a valid Team To-Do export. Your current list is unchanged.</div>':'')+'</div></div></section></main>'}var P=[['--c-primary','#1d5fd1','Buttons, active nav, links, Pending badge (5.6:1 on white)'],['--c-text','#1c2430','Body text (15.6:1)'],['--c-muted','#55606e','Meta text, hints (6.4:1; 5.9:1 on week row)'],['--c-bg','#f6f7f9','Page background'],['--c-surface','#ffffff','Cards, list rows'],['--c-border','#d5dae1','Card and row borders'],['--c-week-bg','#fff4d6','This-week row highlight'],['--c-week-text','#7a4d00','"This week" badge text (7.4:1)'],['--c-done','#1e7a46','Done badge, checkbox (5.4:1)'],['--c-danger','#b42318','Errors, delete, confirm buttons (6.5:1)'],['--c-danger-bg','#fdecea','Storage warning banner (5.9:1 text)'],['--c-focus','#ffbf47','Focus outline 3px']];function notes(){return hdr('')+'<main><section class="card"><h2>Design notes</h2><h3>Palette</h3>'+P.map(function(p){return '<div class="sw"><i style="background:'+p[1]+'"></i><span><code>'+p[0]+'</code> '+p[1]+' – '+p[2]+'</span></div>'}).join('')+'<h3>Typography</h3><p>System stack <code>--font</code>. Scale: <code>--fs-xs</code> 13px badges/hints, <code>--fs-sm</code> 14px labels/meta, <code>--fs-md</code> 16px body and inputs (prevents iOS zoom), <code>--fs-lg</code> 20px headings, <code>--fs-xl</code> 24px. Weights 400/600/700. Line height 1.45.</p><h3>Spacing and shape</h3><p><code>--sp-1..6</code> = 4, 8, 12, 16, 24, 32px. <code>--radius</code> 8px cards, <code>--radius-sm</code> 4px controls. Max content width 880px; padding 16px. Controls and row buttons min 44px tall.</p><h3>Responsive layout (verify with the 375px and 1280px buttons in the mockup bar)</h3><div class="tw"><table><tr><th>Width</th><th>Layout</th></tr><tr><td>375px phone (BRD target; also holds at 360px)</td><td>Single column. Form fields stack: title, assignee, due date, Add task full width. Filters stack, Clear completed below. Task rows wrap: Edit/Delete move to their own line, right-aligned. Member rows wrap Rename/Remove under the name. No horizontal scroll.</td></tr><tr><td>720px+</td><td>Form on one row (2fr 1fr 1fr auto); filters on one row (1fr 1fr auto).</td></tr><tr><td>1280px laptop (BRD target)</td><td>Same as 720px+, content centred at max 880px.</td></tr></table></div><p><strong>Date input:</strong> native <code>type=date</code>, full width, min 44px, <code>appearance:none</code> and <code>min-width:0</code> so iOS Safari does not overflow its column. Shows the native picker on phones. <strong>File input:</strong> native <code>type=file</code> with <code>accept=.json</code>, full width, 14px text so the button and file name fit at 375px; the selected file name shows below. Both must be checked in Safari, Chrome and Firefox at 375px in Phase 6.</p><h3>Component styles</h3><p>Primary button: blue fill, white text. Secondary: white fill, blue border. Danger: red fill (confirm only). Link button: Edit/Delete in rows. Disabled: grey with 4.6:1 text. Inputs: 1px #8a94a3 border (3:1), error = 2px red border + text message. Focus: 3px amber outline, 2px offset, on every control. Badges: pill with text, never colour alone (This week, Pending, Done, Unassigned). Confirm dialogs: title, one sentence naming what changes, Cancel (secondary) then destructive action (danger); Cancel gets focus first.</p><h3>Confirm texts</h3><div class="tw"><table><tr><th>Action</th><th>Text</th></tr><tr><td>Delete task (US-02)</td><td>Delete "Send sprint summary to stakeholders"? This cannot be undone.</td></tr><tr><td>Clear completed (US-08)</td><td>Remove 3 completed tasks? This cannot be undone.</td></tr><tr><td>Import (US-10)</td><td>Replace your current list? Importing replaces all 5 tasks and 5 team members on this device with the file's contents.</td></tr></table></div><h3>SDD component map</h3><div class="tw"><table><tr><th>Component</th><th>Shown as</th></tr><tr><td><code>App</code></td><td>Header + Tasks/Settings nav (screen state)</td></tr><tr><td><code>StorageWarning</code></td><td>Red banner under header, role=status</td></tr><tr><td><code>TaskListScreen</code></td><td>Tasks screen</td></tr><tr><td><code>TaskForm</code></td><td>Add a task / Edit task card</td></tr><tr><td><code>FilterBar</code></td><td>Assignee + Status selects</td></tr><tr><td><code>ClearCompletedButton</code></td><td>In filter card; disabled with no Done tasks</td></tr><tr><td><code>TaskItem</code></td><td>List row: checkbox, title, assignee, due, badges, Edit, Delete (with confirm)</td></tr><tr><td><code>SettingsScreen</code></td><td>Settings screen</td></tr><tr><td><code>MemberManager</code></td><td>Team members card</td></tr><tr><td><code>ExportImport</code></td><td>Export and import card, replace warning, error</td></tr></table></div><h3>Tokens for src/styles.css</h3><p>Copy the <code>:root</code> block of this file unchanged. Confirms use a native-looking modal here; build may use <code>window.confirm</code> per SDD with the same text.</p></section></main>'}var S={filled:function(){return hdr('t')+'<main>'+form()+filters('Pending',1)+list(T,0,'Pending tasks')+'</main>'},empty:function(){return hdr('t')+'<main>'+form()+filters('Pending',0)+'<section class="card"><h2>Pending tasks</h2><div class="empty"><p><strong>No pending tasks.</strong></p><p>Add your first task above. Add team members in Settings to assign tasks.</p></div></section></main>'},error:function(){return hdr('t')+'<main>'+form(1)+filters('Pending',1)+list(T,0,'Pending tasks')+'</main>'},all:function(){return hdr('t')+'<main>'+form()+filters('All',1,'Priya')+mixed(PA,'Priya – all tasks')+'</main>'},done:function(){return hdr('t')+'<main>'+form()+filters('Done',1)+list(D,1,'Done tasks')+'</main>'+dlg('Clear completed','Remove 3 completed tasks? This cannot be undone.','Remove','done0')},done0:function(){return hdr('t')+'<main>'+form()+filters('Done',1)+list(D,1,'Done tasks')+'</main>'},edit:function(){return hdr('t')+'<main>'+form(0,{t:'Send sprint summary to stakeholders',a:'m2',iso:'2026-11-20'})+filters('Pending',1)+list(T,0,'Pending tasks')+'</main>'},del:function(){return S.filled()+dlg('Delete task','Delete "Send sprint summary to stakeholders"? This cannot be undone.','Delete','filled')},warn:function(){return hdr('t')+'<div class="warn" role="status">Changes could not be saved in this browser. Export your list to keep a copy.</div><main>'+form()+filters('Pending',1)+list(T,0,'Pending tasks')+'</main>'},settings:function(){return settings(0,0)},limit:function(){return settings(1,0)},'import':function(){return settings(0,0,1)+dlg('Replace your current list?','Importing replaces all 5 tasks and 5 team members on this device with the contents of team-todo-2026-11-18.json. This cannot be undone.','Replace list','settings')},importerr:function(){return settings(0,1)},notes:notes};function go(s){CUR=s;document.getElementById('app').innerHTML=S[s]();document.querySelectorAll('.mock button[data-s]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.s==s||(s=='done0'&&b.dataset.s=='done'))});var c=document.querySelector('.dialog .btn.sec');if(c)c.focus()}function vw(w){W=w;document.getElementById('frame').className=w=='fluid'?'':w;document.querySelectorAll('.mock button[data-w]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.w==w)})}document.addEventListener('click',function(e){var w=e.target.closest('[data-w]');if(w){vw(w.dataset.w);return}var b=e.target.closest('[data-s]');if(b)go(b.dataset.s)});document.addEventListener('keydown',function(e){if(e.key=='Escape'&&document.querySelector('.overlay')){var c=document.querySelector('.dialog .btn.sec');go(c.dataset.s)}});vw('fluid');go('filled')</script></body></html>
